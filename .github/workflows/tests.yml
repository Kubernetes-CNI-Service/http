name: Public repository tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPYCACHEPREFIX: /tmp/http-test-pyc
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit public publication boundary
        run: python3 -B test_cases/audit_public_tree.py

      - name: Verify approved source and test state
        run: python3 -B test_cases/run_related_tests.py --check

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run complete offline-safe test suite
        run: python3 -B -m unittest discover -s test_cases -t . -p 'test_*.py' -v
