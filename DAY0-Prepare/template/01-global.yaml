# Public bootstrap template.  Documentation IP/MAC values and locked
# credentials below are deliberately non-production defaults; replace them in
# each local project before strict setup/load.
schema_version: 2
common:
  mgmt:
    # Optional online Issue Tracker sync, disabled by default. When enabled,
    # every collection is followed by syncing its link results into the online
    # document: spreadsheet_id is the ID in the document URL (matching
    # [A-Za-z0-9_-]{20,}); credentials names the Google service account JSON
    # kept in this project directory (default cre.json, mode 600), never in git.
    # publish_every_cycles defaults to 1.
    issue-tracker:
      status: disabled
    dhcp-server:
      status: enabled
      package: isc-dhcp-server
    http:
      status: enabled
      # Replace with this management host's explicit HTTP service IPv4.
      address: 203.0.113.80
      http_root: /var/www/html
      package: apache2
      port: 80
    ztp:
      status: enabled
      ztp_url_prefix: /ztp
  switch:
    system:
      config:
        auto-save:
          state: enabled
      dns:
        server:
        - 192.0.2.53
        - 198.51.100.53
      ntp:
        server:
        - 192.0.2.123
        - 198.51.100.123
        - 203.0.113.123
      date-time:
        timezone: Etc/UTC
switches:
- eth:
    version: 5.16.4
    mlag:
      init-delay: 20
      priority:
      - 100
      - 200
      # Optional VXLAN active-active shared-address overrides, commented out so
      # setup and config generation do not refuse a project without MLAG pairs
      # for an override that matches nothing.  Without an override each
      # VXLAN active-active MLAG pair (the rows of 02-devices_config.csv that share
      # one bond_mac) uses the next IPv4 after the larger of its peer loopbacks.
      # Uncomment only when that automatic address conflicts, and list only the
      # bond_mac of such a pair: an entry that matches no VXLAN active-active MLAG
      # pair in the CSV stops setup and config generation.
      # shared-addresses:
      # - bond-mac: '02:00:00:ff:01:ff'
      #   anycast-ip: 192.0.2.201
      # - bond-mac: '02:00:00:ff:02:ff'
      #   anycast-ip: 192.0.2.202
    bridge:
      domain:
        br_default:
          stp:
            priority: 4096
    vrr:
      base_mac: 02:00:5e:01:00:00
      gateway_ip: subnet_maximum
    services:
      dhcp_relay:
        inband:
          server_group:
          - group: bcm
            servers:
            - 192.0.2.101
            - 192.0.2.102
        oob:
          server_group:
          - group: bcm
            servers:
            - 198.51.100.151
          - group: ztp-server
            servers:
            - 198.51.100.240
    system:
      aaa:
        user:
          cumulus:
            full-name: cumulus,,,
            hashed-password: "'*'"
      ntp:
        vrf: mgmt
      dns:
        vrf: mgmt
    vrf:
      default:
        router:
          bfd:
            profile:
              bgp-underlay-bfd:
                detect-multiplier: 3
                min-rx-interval: 300
                min-tx-interval: 300
    vrl:
    - leaking_vrfs: [inband, oob]
      inband:
      - internalnet: 192.0.2.0/25
      oob:
      - oobnet: 198.51.100.0/24
        max-prefix-len: 29
        min-prefix-len: 20
- ib:
    version: 25-02-8008
    system:
      aaa:
        user:
          admin:
            password: '*'
      security:
        password-hardening:
          state: disabled
      ztp:
        config-save: enabled
- nvl:
    version: 25.02.4347
    system:
      aaa:
        user:
          admin:
            password: '*'
      security:
        password-hardening:
          state: disabled
      ztp:
        config-save: enabled
# Optional UFM servers (R-013), commented out so a project without UFM is
# unchanged.  For a project with UFM, uncomment and replace every documentation
# address; the format is described in infiniband/bringup/ufm-setup-upgrade/README.md.
# vip (the HA address, two nodes only) sits in the server_ufm rows' management
# subnet, and so does an ipmi address written without a gateway; the other
# interface addresses must not overlap that subnet.  version is optional: only a
# declared version upgrades the UFM.
# servers:
#   - ufm:
#       version: "2.6.1-5"
#       vip: 192.0.2.20
#       interfaces:
#         alias:
#           eth0: eno8303
#         primary:
#           ipmi:
#             address: 192.0.2.21/26
#           eno8403: 192.0.2.129/30
#           ib0: 192.0.2.193/27
#         secondary:
#           ipmi:
#             address: 192.0.2.22/26
#           eno8403: 192.0.2.130/30
#           ib0: 192.0.2.194/27
