global(workDirectory="/var/spool/rsyslog")
module(load="imuxsock" SysSock.Name="/dev/log")

template(
    name="HttpZtpFileFormat"
    type="string"
    string="%timegenerated:::date-rfc3339% %hostname% %syslogtag%%msg%\n"
)

if $programname == "dhcpd" then {
    if (
        re_match($msg, "^ *Internet Systems Consortium DHCP Server [^ ]+ *$") or
        re_match($msg, "^ *Copyright [0-9][0-9-]* Internet Systems Consortium\\. *$") or
        re_match($msg, "^ *All rights reserved\\. *$") or
        re_match($msg, "^ *For info, please visit https://www\\.isc\\.org/software/dhcp/ *$") or
        re_match($msg, "^ *Config file: /etc/dhcp/dhcpd\\.conf *$") or
        re_match($msg, "^ *Database file: /var/lib/dhcp/dhcpd\\.leases *$") or
        re_match($msg, "^ *PID file: /var/run/dhcpd\\.pid *$")
    ) then {
        stop
    }
    action(
        type="omfile"
        file="/var/log/http-ztp/dhcpd.log"
        template="HttpZtpFileFormat"
    )
    stop
}

action(
    type="omfile"
    file="/var/log/http-ztp/syslog"
    template="HttpZtpFileFormat"
)
