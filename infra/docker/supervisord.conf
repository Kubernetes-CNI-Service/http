[unix_http_server]
file=/run/http-ztp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/http-ztp/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=/run/http-ztp/supervisord.pid
childlogdir=/var/log/http-ztp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/http-ztp/supervisor.sock

[program:rsyslog]
command=/usr/sbin/rsyslogd -n -iNONE -f /opt/http-ztp/rsyslog-dhcp.conf
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/rsyslog-console.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:apache2]
command=/opt/http-ztp/activate.py exec-service apache2
priority=30
autostart=false
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/apache2-console.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:dhcpd]
command=/opt/http-ztp/activate.py exec-service dhcpd
priority=40
autostart=false
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/dhcpd-console.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:ztp-monitor]
command=/opt/http-ztp/activate.py exec-service ztp-monitor
directory=/var/www/html
priority=50
autostart=false
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/ztp-monitor-background.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:switch-collection]
command=/opt/http-ztp/activate.py exec-service switch-collection
directory=/var/www/html
environment=HTTP_ZTP_ASKPASS_TMPDIR="/run/http-ztp/askpass"
priority=60
autostart=false
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/monitor/status/switch-collection.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:manual-ztp]
command=/opt/http-ztp/activate.py exec-service manual-ztp
directory=/var/www/html
priority=70
autostart=false
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/html/monitor/status/manual-ztp.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:runtime-resume]
command=/opt/http-ztp/hostctl.py resume
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/runtime-resume.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:runtime-guardian]
command=/opt/http-ztp/hostctl.py guardian
priority=18
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/runtime-guardian.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

[program:logrotate]
command=/opt/http-ztp/hostctl.py rotate-logs
priority=15
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/http-ztp/logrotate-console.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
